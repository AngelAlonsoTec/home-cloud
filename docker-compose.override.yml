# Development: source code is mounted and reloaded on every change.
# node_modules live in anonymous volumes, so they are installed for Linux
# inside the containers and never mixed with the ones on the host.
services:
  api:
    image: node:24-alpine
    working_dir: /usr/src/app/server
    volumes:
      - ./server:/usr/src/app/server
      - /usr/src/app/server/node_modules
    command: sh -c "npm ci && npm run dev"

  web:
    image: node:24-alpine
    working_dir: /usr/src/app/client
    volumes:
      - ./client:/usr/src/app/client
      - /usr/src/app/client/node_modules
    environment:
      API_PROXY_TARGET: http://api:5000
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "${HOME_CLOUD_PORT:-8080}:3000"
