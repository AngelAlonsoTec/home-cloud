# Serves the React app and forwards /api to the backend, so both share the
# same origin (no CORS needed, and the session cookie works for downloads)
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream uploads and downloads instead of buffering them.
        # The upload size limit is enforced by the backend
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Client side routing: unknown paths are handled by React Router
    location / {
        try_files $uri /index.html;
    }
}
